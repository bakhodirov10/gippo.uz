name: Gippo CI (Continuous Integration)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check (TypeScript)
        run: npx tsc --noEmit

  build:
    name: Build & Verification
    runs-on: ubuntu-latest
    needs: [validate]
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gippo_ci?schema=public"
      JWT_SECRET: "ci-dummy-jwt-secret-key-2026"
      JWT_REFRESH_SECRET: "ci-dummy-jwt-refresh-secret-key-2026"
      ADMIN_REGISTRATION_SECRET: "ci-dummy-admin-code-2026"
      PAYMENT_SECRET: "ci-dummy-payment-secret"
      PAYMENT_WEBHOOK_SECRET: "ci-dummy-webhook-secret"
      GEMINI_API_KEY: "dummy_ci_gemini_key_for_build"
      AI_API_KEY: "dummy_ci_gemini_key_for_build"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Build Next.js Application
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -d .next || exit 1
          echo "Next.js build succeeded and artifacts verified!"
